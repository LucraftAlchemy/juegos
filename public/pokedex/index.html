<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex de Lucas</title>
<meta name="theme-color" content="#d7263d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* Layout: barra roja fija arriba (casita, título, pestañas de modo, buscador y filtros); cada modo es una sección de main. */
:root{
  --red:#d7263d; --red2:#9e1328; --bg:#eef1f6; --card:#ffffff; --ink:#1b2230; --muted:#5f6b7f; --line:#d6dce6;
  --chip:#ffffff; --chipOn:#1b2230; --chipOnInk:#ffffff; --stage1:#cfe9ff; --stage2:#eaf7e4; --ground:#8fc77a;
  --ok:#2e9e4f; --bad:#d7263d; --gold:#f2b705;
  --fDisplay:"Chakra Petch", system-ui, sans-serif; --fBody:"M PLUS Rounded 1c", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12151d; --card:#1c212d; --ink:#eef1f7; --muted:#a3adbf; --line:#2d3444; --chip:#1c212d; --chipOn:#eef1f7; --chipOnInk:#12151d;
  --stage1:#1d3550; --stage2:#1e3324; --ground:#3e6b34; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fBody);font-size:16px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--red),var(--red2));color:#fff;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center}
.home{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;text-decoration:none;font-size:22px}
.lens{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d6f1ff,#2a8ee0 55%,#0b3f78);border:3px solid #fff;flex:none}
h1{font-family:var(--fDisplay);font-size:20px;margin:0;letter-spacing:.05em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){h1{font-size:16px;letter-spacing:.02em}.lens{width:28px;height:28px}}
.vbtn{font:700 14px var(--fBody);border:0;border-radius:999px;padding:9px 12px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tabs button{font:800 15px var(--fBody);border:0;border-radius:14px;padding:10px 6px;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--red2)}
.search{display:flex;gap:6px;margin-top:10px}
.search input,.search select{font:inherit;border:0;border-radius:12px;padding:10px;background:#fff;color:#1b2230;min-width:0}
.search input{flex:1}
.search select{flex:none;max-width:24%}
.dice{flex:none;font:800 15px var(--fBody);border:0;border-radius:12px;padding:0 12px;background:var(--gold);color:#1b2230;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:700 14px var(--fBody);border:0;border-radius:999px;padding:8px 13px;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
.chips button[aria-pressed="true"]{background:#fff;color:var(--red2)}
.chips button span{opacity:.7;font-weight:400;margin-left:4px}
main{padding-top:12px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.meta{color:var(--muted);font-size:14px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.card{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:8px 4px 10px;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible,.chips button:focus-visible,.btn:focus-visible,.tabs button:focus-visible,.opt:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.card img{width:104px;height:104px;object-fit:contain}
.card .fav{position:absolute;top:6px;right:8px;font-size:16px}
.num{font:700 12px var(--fDisplay);color:var(--muted);letter-spacing:.04em}
.nm{font-weight:800;font-size:15px;text-align:center;line-height:1.15;word-break:break-word}
.tag{font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;margin-top:2px}
.status{text-align:center;padding:40px 0;color:var(--muted)}
/* Ficha */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.modal{align-items:center;padding-bottom:10px}}
.sheet{background:var(--card);width:100%;max-width:580px;max-height:100%;overflow:auto;border-radius:20px 20px 0 0;
  padding:0 0 calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:20px}}
.stage{position:relative;height:300px;background:linear-gradient(var(--stage1),var(--stage2));overflow:hidden;touch-action:none;cursor:grab;perspective:700px;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.ground{position:absolute;left:50%;bottom:36px;width:220px;height:56px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.28),rgba(0,0,0,0) 65%),radial-gradient(ellipse at center,var(--ground),transparent 70%)}
.ring{position:absolute;left:50%;bottom:30px;width:250px;height:68px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.spin{position:absolute;left:0;right:0;bottom:58px;height:210px;display:flex;align-items:flex-end;justify-content:center;transform-style:preserve-3d}
.spin img{max-height:200px;max-width:80%;height:200px;object-fit:contain;object-position:bottom;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite;pointer-events:none}
.spin img.hd{image-rendering:auto}
@keyframes bob{50%{translate:0 -6px}}
.close{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer}
.hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--ink);opacity:.7}
.ctrls{position:absolute;right:10px;bottom:8px;display:flex;gap:6px}
.mini{font:700 13px var(--fBody);border:0;border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.85);color:#1b2230;cursor:pointer}
.mini[aria-pressed="true"]{background:#1b2230;color:#fff}
.body{padding:14px 16px 0;display:grid;gap:12px}
.title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title h2{font-family:var(--fDisplay);font-size:26px;margin:0;line-height:1.1}
.star{margin-left:auto;font:800 14px var(--fBody);border:2px solid var(--gold);border-radius:999px;padding:6px 12px;background:transparent;color:var(--ink);cursor:pointer}
.star[aria-pressed="true"]{background:var(--gold);color:#1b2230}
.genus{color:var(--muted)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.type{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.type small{font-size:11px;opacity:.9;margin-left:3px}
.flavor{margin:0;line-height:1.5;background:var(--bg);border-radius:12px;padding:10px 12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--bg);border-radius:12px;padding:8px 10px}
.facts b,.sec b{display:block;font:700 11px var(--fDisplay);letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.sec{background:var(--bg);border-radius:12px;padding:10px 12px}
.sec .types{margin-bottom:6px}
.evo{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.evo .stg{display:flex;flex-direction:column;gap:4px}
.evo button{background:var(--card);border:2px solid transparent;border-radius:12px;padding:4px 6px;cursor:pointer;font:700 12px var(--fBody);color:var(--ink);display:flex;flex-direction:column;align-items:center}
.evo button[aria-current="true"]{border-color:var(--red)}
.evo img{width:64px;height:64px;object-fit:contain}
.evo .arr{font-size:20px;color:var(--muted)}
.stat{display:grid;grid-template-columns:82px 34px 1fr;gap:8px;align-items:center;font-size:14px;margin-bottom:4px}
.stat span:nth-child(2){font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.track{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--red)}
.actions{display:flex;gap:8px}
.btn{flex:1;font:800 15px var(--fBody);border:0;border-radius:14px;padding:12px;cursor:pointer;background:var(--chipOn);color:var(--chipOnInk)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.go{background:var(--ok);color:#fff}
.btn[aria-pressed="true"]{background:var(--gold);color:#1b2230}
.btn:disabled{opacity:.45;cursor:default}
/* ¿Quién es? */
.quiz{max-width:560px;margin:0 auto;display:grid;gap:12px}
.qtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtop select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:9px;background:var(--card);color:var(--ink)}
.score{margin-left:auto;font:700 15px var(--fDisplay);display:flex;gap:10px}
.score span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.qstage{position:relative;height:300px;border-radius:20px;background:radial-gradient(circle at 50% 55%,#fff7c2,#ffd23f 45%,#f28c28 100%);display:grid;place-items:center;overflow:hidden}
.qstage h3{position:absolute;top:10px;left:0;right:0;margin:0;text-align:center;font:700 22px var(--fDisplay);color:#1b2230;letter-spacing:.03em}
.qstage img{width:230px;height:230px;object-fit:contain;margin-top:24px;transition:filter .5s}
.qstage img.sil{filter:brightness(0)}
.qstage .res{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:800 22px var(--fBody);color:#1b2230}
.opts{display:grid;gap:8px}
.opt{font:800 19px var(--fBody);border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
/* Música */
.music{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.panel h3{margin:0 0 8px;font:700 17px var(--fDisplay);letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.panel h3 small{font:400 13px var(--fBody);color:var(--muted);margin-left:auto}
.song{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;min-height:110px}
.slot{position:relative;border:2px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;cursor:pointer;font:inherit;color:var(--ink)}
.slot img{width:70px;height:70px;object-fit:contain}
.slot .t{font:800 12px var(--fBody)}
.slot .n{position:absolute;top:4px;left:7px;font:700 11px var(--fDisplay);color:var(--muted)}
.slot .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:13px;cursor:pointer}
.slot.on{border-color:var(--gold);background:#fff4c7;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.08)}}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:26px 8px;border:2px dashed var(--line);border-radius:16px}
.mctrl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){.mctrl{grid-template-columns:1fr 1fr}}
.speed{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.speed > span{font-weight:700;color:var(--muted);font-size:14px}
.speed button{font:800 15px var(--fBody);border:2px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--card);color:var(--ink);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.pick{display:flex;gap:6px;margin-bottom:8px}
.pick input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:330px;overflow:auto}
.picks button{background:var(--bg);border:0;border-radius:14px;padding:4px 2px 6px;cursor:pointer;font:700 12px var(--fBody);color:var(--ink);display:flex;flex-direction:column;align-items:center}
.picks img{width:62px;height:62px;object-fit:contain}
.mnote{font-size:13px;color:var(--muted);margin:8px 0 0}
.mic{flex:none;font-size:20px;border:0;border-radius:12px;padding:0 12px;background:#fff;color:#1b2230;cursor:pointer;min-width:46px}
.mic.on{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.heard{font-size:14px;color:var(--muted);margin:0 0 8px;min-height:1em}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row2 > span{font-weight:700;color:var(--muted);font-size:14px;min-width:84px}
.row2 button{font:800 15px var(--fBody);border:2px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--card);color:var(--ink);cursor:pointer}
.row2 button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;font-size:22px}
.vol input{flex:1;accent-color:var(--red);height:28px}
.show{position:relative;height:170px;border-radius:16px;margin-bottom:10px;overflow:hidden;
  background:radial-gradient(circle at 50% 120%,#ff5fa2,#7b3fe4 55%,#1d1452);display:grid;place-items:center}
.show img{width:140px;height:140px;object-fit:contain;animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg) scale(1.06)}}
.show .note{position:absolute;bottom:-20px;font-size:26px;animation:fly 2.2s linear forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-210px) rotate(30deg);opacity:0}}
.qmode{display:flex;gap:6px}
.qmode button{font:800 14px var(--fBody);border:2px solid var(--line);border-radius:999px;padding:7px 11px;background:var(--card);color:var(--ink);cursor:pointer}
.qmode button[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.qstage img.hide{visibility:hidden}
.qsound{position:absolute;inset:50px 0 50px;margin:auto;width:150px;height:150px;border-radius:50%;border:0;font-size:64px;background:rgba(255,255,255,.75);cursor:pointer}
.qmic{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <a class="home" href="../" aria-label="Regresar a los juegos">🏠</a>
      <div class="lens" aria-hidden="true"></div>
      <h1>POKÉDEX DE LUCAS</h1>
      <button class="vbtn" id="voiceBtn" type="button">Voz: sí</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Modo">
      <button type="button" data-m="dex" aria-pressed="true">📖 Pokédex</button>
      <button type="button" data-m="quiz" aria-pressed="false">❓ ¿Quién es?</button>
      <button type="button" data-m="music" aria-pressed="false">🎵 Música</button>
    </nav>
    <div id="dexBar">
      <div class="search">
        <input id="q" type="search" placeholder="Buscar nombre o número" aria-label="Buscar" autocomplete="off">
        <button class="mic" id="micDex" type="button" aria-label="Buscar diciendo el nombre" hidden>🎤</button>
        <select id="type" aria-label="Tipo"><option value="">Tipo</option></select>
        <select id="gen" aria-label="Generación"><option value="">Gen</option></select>
        <button class="dice" id="dice" type="button" aria-label="Pokémon sorpresa">🎲</button>
      </div>
      <nav class="chips" id="chips" aria-label="Categoría"></nav>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="m-dex">
    <p class="heard" id="heardDex" hidden></p>
    <p class="meta" id="meta"></p>
    <div class="grid" id="grid"></div>
    <div class="status" id="status">Cargando Pokémon…</div>
  </section>

  <section id="m-quiz" hidden>
    <div class="quiz">
      <div class="qtop">
        <div class="qmode" id="qmode">
          <button type="button" data-q="sil" aria-pressed="true">👀 Silueta</button>
          <button type="button" data-q="snd" aria-pressed="false">👂 Sonido</button>
        </div>
        <select id="qgen" aria-label="Generación del juego"><option value="">Todas las gen</option></select>
        <div class="score"><span id="qScore">✅ 0</span><span id="qStreak">🔥 0</span></div>
      </div>
      <div class="qstage">
        <h3 id="qTitle">¿Quién es ese Pokémon?</h3>
        <img id="qImg" class="sil" alt="Pokémon misterioso">
        <button class="qsound" id="qSound" type="button" aria-label="Escuchar otra vez" hidden>🔊</button>
        <div class="res" id="qRes"></div>
      </div>
      <div class="opts" id="qOpts"></div>
      <button class="btn alt" id="micQuiz" type="button" hidden>🎤 Decir la respuesta</button>
      <p class="heard" id="heardQuiz" hidden></p>
      <button class="btn go" id="qNext" type="button" hidden>Siguiente ▶</button>
    </div>
  </section>

  <section id="m-music" hidden>
    <div class="music">
      <div class="panel">
        <h3>🎶 Mi canción <small id="songCount">0 / 16</small></h3>
        <div class="show" id="show" hidden><img id="showImg" alt=""></div>
        <div class="song" id="song"></div>
        <div class="mctrl">
          <button class="btn go" id="playBtn" type="button">▶ Tocar</button>
          <button class="btn alt" id="loopBtn" type="button" aria-pressed="false">🔁 Repetir</button>
          <button class="btn alt" id="surpBtn" type="button">🎲 Sorpresa</button>
          <button class="btn alt" id="clearBtn" type="button">🗑️ Borrar</button>
        </div>
        <div class="row2">
          <div class="vol"><span aria-hidden="true">🔈</span><input id="vol" type="range" min="0" max="100" step="5" aria-label="Volumen"><span aria-hidden="true">🔊</span></div>
        </div>
        <div class="row2" id="speed">
          <span>Velocidad</span>
          <button type="button" data-s="0" aria-pressed="false">🐢 Lento</button>
          <button type="button" data-s="1" aria-pressed="true">🚶 Normal</button>
          <button type="button" data-s="2" aria-pressed="false">🐇 Rápido</button>
        </div>
        <div class="row2" id="kits">
          <span>🥁 Batería</span>
          <button type="button" data-k="0">Sin</button>
          <button type="button" data-k="1">Básica</button>
          <button type="button" data-k="2">Rock</button>
          <button type="button" data-k="3">Fiesta</button>
        </div>
        <div class="row2" id="insts">
          <span>De fondo</span>
          <button type="button" data-in="bass">🎸 Bajo</button>
          <button type="button" data-in="gtr">🪕 Guitarra</button>
          <button type="button" data-in="piano">🎹 Piano</button>
          <button type="button" data-in="bell">🔔 Campanitas</button>
        </div>
        <p class="mnote">Toca un Pokémon de tu canción para cambiar su voz: 🎵 normal → ⬆️ aguda → ⬇️ grave.</p>
      </div>
      <div class="panel">
        <h3>➕ Agrega Pokémon</h3>
        <div class="pick">
          <input id="mq" type="search" placeholder="Busca un Pokémon" aria-label="Buscar Pokémon para la canción" autocomplete="off">
          <button class="mic" id="micMusic" type="button" aria-label="Agregar diciendo el nombre" style="background:var(--bg)" hidden>🎤</button>
          <button class="dice" id="mDice" type="button" aria-label="Agregar uno sorpresa">🎲</button>
        </div>
        <p class="heard" id="heardMusic" hidden></p>
        <div class="picks" id="picks"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>

const TYPES = {normal:["Normal","#9a9a7a"],fire:["Fuego","#e8742e"],water:["Agua","#4a86e0"],grass:["Planta","#5fae46"],electric:["Eléctrico","#d9a90f"],

const LEG = new Set([144,145,146,150,243,244,245,249,250,377,378,379,380,381,382,383,384,480,481,482,483,484,485,486,487,488,638,639,640,641,642,643,644,645,646,716,717,718,772,773,785,786,787,788,789,790,791,792,800,888,889,890,891,892,894,895,896,897,898,905,1001,1002,1003,1004,1007,1008,1014,1015,1016,1017,1024]);
const MYTH = new Set([151,251,385,386,489,490,491,492,493,494,647,648,649,719,720,721,801,802,807,808,809,893,1025]);
const UB = new Set([793,794,795,796,797,798,799,803,804,805,806]);
const PARADOX = new Set([984,985,986,987,988,989,990,991,992,993,994,995,1005,1006,1009,1010,1020,1021,1022,1023]);
const REG = {alola:"de Alola",galar:"de Galar",hisui:"de Hisui",paldea:"de Paldea"};
const CATS = [
  ["all","Todos"],["fav","⭐ Favoritos"],["mega","Mega"],["gmax","Gigamax"],["regional","Regionales"],["legend","Legendarios"],

let list = [], species = [], cat = "all", typeSet = null, voiceOn = true, current = null, audio = null, favs = new Set();
const cache = {}, typeJson = {}, evoCache = {};
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },

const pretty = n => n.replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const pad = id => "#"+String(id).padStart(4,"0");
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const rnd = a => a[Math.floor(Math.random()*a.length)];
const art = id => `${S}other/official-artwork/${id}.png`;
const home = id => `${S}other/home/${id}.png`;
const imgTag = (id, cls="") => `<img loading="lazy" alt="" ${cls?`class="${cls}"`:""} src="${home(id)}" onerror="this.onerror=null;this.src='${art(id)}'">`;

function formInfo(name, base){
  const rest = name.slice(base.length+1).split("-");
  const B = pretty(base);
  if(rest.includes("mega")){ const x = rest.filter(t=>t!=="mega").join(" ").toUpperCase(); return {cat:"mega", label:`Mega ${B}${x?" "+x:""}`, pre:"Mega ", suf:x?" "+x:""}; }
  if(rest[0]==="primal") return {cat:"mega", label:`${B} Primigenio`, pre:"", suf:" Primigenio"};
  if(rest.includes("gmax")) return {cat:"gmax", label:`${B} Gigamax`, pre:"", suf:" Gigamax"};
  if(REG[rest[0]]){ const ex = rest.slice(1).join(" "); const suf = ` ${REG[rest[0]]}${ex?" ("+ex+")":""}`; return {cat:"regional", label:B+suf, pre:"", suf}; }
  const suf = ` (${rest.join(" ")})`; return {cat:"other", label:B+suf, pre:"", suf};
}
function cats(p){
  if(p.form) return [p.form.cat];
  const c=[]; if(LEG.has(p.sid))c.push("legend"); if(MYTH.has(p.sid))c.push("myth"); if(UB.has(p.sid))c.push("ub"); if(PARADOX.has(p.sid))c.push("paradox"); return c;
}

/* ---------- Pokédex ---------- */
function buildUI(){
  const typeOpts = Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
  const genOpts = GENS.map((g,i)=>`<option value="${i}">Gen ${i+1}</option>`).join("");
  $("type").innerHTML = `<option value="">Tipo</option>` + typeOpts;
  $("gen").innerHTML = `<option value="">Gen</option>` + genOpts;
  $("qgen").innerHTML = `<option value="">Todas las gen</option>` + genOpts;
  $("qgen").value = store.get("quizGen", "");
  $("chips").innerHTML = CATS.map(([k,l])=>`<button type="button" data-c="${k}" aria-pressed="${k===cat}">${l}<span id="n-${k}"></span></button>`).join("");
  $("chips").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; cat=b.dataset.c;
    document.querySelectorAll("#chips button").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); };
  $("q").oninput = render; $("gen").onchange = render;
  $("type").onchange = async ()=>{
    const t = $("type").value; if(!t){ typeSet=null; return render(); }
    try{ $("status").hidden=false; $("status").textContent="Cargando tipo…"; const j = await getType(t); typeSet = new Set(j.pokemon.map(x=>+x.pokemon.url.split("/").filter(Boolean).pop())); }
    catch(e){ $("status").textContent="No se pudo cargar el tipo. Revisa tu internet."; return; }
    render();
  };
  $("dice").onclick = ()=>{ const v = visible(); const pool = v.length ? v : species; if(pool.length) openSheet(rnd(pool)); };
}
async function getType(t){
  if(!typeJson[t]) typeJson[t] = fetch(API+"type/"+t).then(r=>{ if(!r.ok) throw 0; return r.json(); }).catch(e=>{ delete typeJson[t]; throw e; });
  return typeJson[t];
}
function render(){
  const q = norm($("q").value).replace("#","");
  const g = $("gen").value==="" ? null : GENS[+$("gen").value];
  const base = list.filter(p=>{
    if(g && (p.sid<g[0]||p.sid>g[1])) return false;
    if(typeSet && !typeSet.has(p.id)) return false;
    if(q && !(p.key.includes(q) || String(p.sid)===q.replace(/^0+/,""))) return false;
    return true;
  });
  const inCat = (p,k)=> k==="all" ? !p.form : k==="fav" ? favs.has(p.id) : p.cats.includes(k);
  CATS.forEach(([k])=>{ const el=$("n-"+k); if(el) el.textContent = base.filter(p=>inCat(p,k)).length; });
  const shown = base.filter(p=>inCat(p,cat));
  $("meta").textContent = `${shown.length} Pokémon · toca uno para verlo y escucharlo`;
  $("grid").innerHTML = shown.map(p=>`<button class="card" type="button" data-id="${p.id}">
    ${favs.has(p.id)?`<span class="fav" aria-label="Favorito">⭐</span>`:""}${imgTag(p.id)}
    <span class="num">${pad(p.sid)}</span><span class="nm">${p.label}</span>${p.form?`<span class="tag">${CATS.find(c=>c[0]===p.form.cat)[1]}</span>`:""}</button>`).join("");
  $("status").hidden = shown.length>0;
  if(!shown.length) $("status").textContent = cat==="fav" ? "Todavía no tienes favoritos. Abre un Pokémon y toca ⭐." : "No hay Pokémon con esos filtros.";
}

async function getData(p){
  if(cache[p.id]) return cache[p.id];
  const [d,s] = await Promise.all([fetch(API+"pokemon/"+p.id).then(r=>r.json()), fetch(API+"pokemon-species/"+p.sid).then(r=>r.json())]);
  const baseEs = (s.names.find(n=>n.language.name==="es")||{}).name || pretty(p.base);
  const nameEs = p.form ? p.form.pre + baseEs + p.form.suf : baseEs;
  const genus = (s.genera.find(n=>n.language.name==="es")||s.genera.find(n=>n.language.name==="en")||{}).genus || "";
  const es = s.flavor_text_entries.filter(f=>f.language.name==="es");
  const clean = t=>t.replace(/[\n\f­]/g," ").replace(/\s+/g," ").trim();
  const flavor = es.length ? clean(es[es.length-1].flavor_text) : `Es un Pokémon de tipo ${d.types.map(x=>TYPES[x.type.name][0]).join(" y ")}.`;
  return cache[p.id] = {d, nameEs, genus, flavor, evoUrl: s.evolution_chain && s.evolution_chain.url};
}

/* Evoluciones: lista de etapas; cada etapa puede tener varias ramas (p. ej. Eevee) */
async function getEvo(url){
  if(!url) return null;
  if(!evoCache[url]) evoCache[url] = fetch(url).then(r=>r.json()).then(j=>{
    const stages=[]; const walk=(n,depth)=>{ const id=+n.species.url.split("/").filter(Boolean).pop();
      (stages[depth] ||= []).includes(id) || stages[depth].push(id); n.evolves_to.forEach(c=>walk(c,depth+1)); };
    walk(j.chain,0); return stages;
  });
  return evoCache[url];
}
/* Debilidades: multiplica el daño recibido de cada tipo atacante según los tipos del Pokémon */
async function getMatchups(types){
  const rel = await Promise.all(types.map(getType));
  const mult = Object.fromEntries(Object.keys(TYPES).map(k=>[k,1]));
  rel.forEach(j=>{ const r=j.damage_relations;
    r.double_damage_from.forEach(t=>{ if(t.name in mult) mult[t.name]*=2; });
    r.half_damage_from.forEach(t=>{ if(t.name in mult) mult[t.name]*=.5; });
    r.no_damage_from.forEach(t=>{ if(t.name in mult) mult[t.name]=0; }); });
  const pick = f=>Object.entries(mult).filter(([,v])=>f(v)).sort((a,b)=>b[1]-a[1]);
  return {weak:pick(v=>v>1), resist:pick(v=>v>0&&v<1), immune:pick(v=>v===0)};
}
const typeChip = (k, m)=>`<span class="type" style="background:${TYPES[k][1]}">${TYPES[k][0]}${m&&m!==2&&m!==.5?`<small>×${m===.25?"¼":m}</small>`:""}</span>`;

function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text), vs = speechSynthesis.getVoices();
  u.voice = vs.find(v=>/es[-_]MX/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
  u.lang = u.voice ? u.voice.lang : "es-MX";
  speechSynthesis.speak(u);
}
function playCry(p){
  return new Promise(res=>{
    if(audio) audio.pause();
    const urls = [CRY+p.id+".ogg"]; if(p.id!==p.sid) urls.push(CRY+p.sid+".ogg");
    let i=0, done=false; const fin=()=>{ if(!done){done=true;res();} };
    const next=()=>{ if(i>=urls.length) return fin(); audio=new Audio(urls[i++]); audio.volume=.6; audio.onended=fin; audio.onerror=next; audio.play().catch(next); };
    next(); setTimeout(fin, 3500);
  });
}
async function announce(p){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  const dp = getData(p).catch(()=>null);
  await playCry(p);
  const d = await dp; if(current!==p) return;
  speak(d ? `${d.nameEs}. ${d.genus}. ${d.flavor}` : p.label);
}

/* Visor giratorio: frente y espalda animados; al pasar de 90° muestra la espalda */
let angle=0, shiny=false, auto=false, srcs={}, raf=null;
function spriteSet(p){
  const sh = shiny ? "shiny/" : "";
  return {front:[`${S}other/showdown/${sh}${p.id}.gif`, `${S}other/home/${sh}${p.id}.png`, `${S}other/official-artwork/${sh}${p.id}.png`],
          back:[`${S}other/showdown/back/${sh}${p.id}.gif`]};
}
function loadSide(side){
  const img=$("sprite"), l=srcs[side]; let i=0;
  const tryIt=()=>{
    if(i>=l.length){ if(side==="back"){ srcs.noBack=true; loadSide("front"); } return; }
    const u=l[i++]; img.onerror=tryIt; img.src=u; img.classList.toggle("hd", !u.endsWith(".gif"));
  };
  tryIt();
}
let side="front";
function draw(){
  const a=((angle%360)+360)%360, back = a>90 && a<270;
  const want = back && !srcs.noBack ? "back" : "front";
  if(want!==side){ side=want; loadSide(side); }
  $("spin").style.transform = `rotateY(${angle}deg)`;
  $("sprite").style.transform = back ? "scaleX(-1)" : "";
}
function loop(){ if(auto){ angle+=1.2; draw(); } raf = $("modal").hidden ? null : requestAnimationFrame(loop); }
let dragX=null;
$("stage").addEventListener("pointerdown",e=>{ if(e.target.closest("button")) return; dragX=e.clientX; $("stage").setPointerCapture(e.pointerId); });
$("stage").addEventListener("pointermove",e=>{ if(dragX===null) return; angle+=(e.clientX-dragX)*0.9; dragX=e.clientX; draw(); });
["pointerup","pointercancel"].forEach(ev=>$("stage").addEventListener(ev,()=>dragX=null));

$("shinyBtn").onclick=()=>{ shiny=!shiny; $("shinyBtn").setAttribute("aria-pressed",shiny); if(current){ srcs=spriteSet(current); side=""; draw(); } };

async function openSheet(p){

  let x; try{ x = await getData(p); }catch(e){ if(current===p) $("sheetBody").innerHTML += `<p class="flavor">Sin conexión. Revisa tu internet.</p>`; return; }
  if(current!==p) return;
  const d=x.d, isFav=favs.has(p.id);
  $("sheetBody").innerHTML = `
    <div class="title"><h2 id="mName">${x.nameEs}</h2><span class="num">${pad(p.sid)}</span>
      <button class="star" type="button" data-a="fav" aria-pressed="${isFav}">${isFav?"⭐ Favorito":"☆ Favorito"}</button></div>
    <div class="genus">${x.genus}</div>
    <div class="types">${d.types.map(t=>typeChip(t.type.name)).join("")}</div>
    <p class="flavor">${x.flavor}</p>
    <div class="sec" id="evoBox"><b>EVOLUCIONES</b><div class="evo">Cargando…</div></div>
    <div class="sec" id="mtBox"><b>DÉBIL CONTRA</b>Cargando…</div>
    <div class="facts">
      <div><b>ALTURA</b>${(d.height/10).toFixed(1)} m</div>
      <div><b>PESO</b>${(d.weight/10).toFixed(1)} kg</div>
      <div style="grid-column:1/-1"><b>HABILIDADES</b>${d.abilities.map(a=>pretty(a.ability.name)).join(", ")}</div>
    </div>
    <div>${d.stats.map(s=>`<div class="stat"><span>${STATS[s.stat.name]}</span><span>${s.base_stat}</span><div class="track"><i style="width:${Math.min(100,s.base_stat/2.55)}%"></i></div></div>`).join("")}</div>
    <div class="actions">
      <button class="btn" type="button" data-a="prev">◀</button>
      <button class="btn" type="button" data-a="play">🔊 Escuchar</button>
      <button class="btn" type="button" data-a="music">🎵 A mi canción</button>
      <button class="btn" type="button" data-a="next">▶</button>
    </div>`;
  getEvo(x.evoUrl).then(st=>{
    if(current!==p) return; const box=$("evoBox").querySelector(".evo");
    const stages = (st||[]).map(s=>s.filter(id=>byId[id])).filter(s=>s.length);
    if(stages.length<2){ box.textContent="Este Pokémon no evoluciona."; return; }
    box.innerHTML = stages.map(s=>`<div class="stg">${s.map(id=>`<button type="button" data-evo="${id}" aria-current="${id===p.sid}">${imgTag(id)}${byId[id].label}</button>`).join("")}</div>`).join(`<span class="arr">➜</span>`);
  }).catch(()=>{ if(current===p) $("evoBox").querySelector(".evo").textContent="No se pudieron cargar."; });
  getMatchups(d.types.map(t=>t.type.name)).then(m=>{
    if(current!==p) return;
    const row=(t,a)=>a.length?`<b>${t}</b><div class="types">${a.map(([k,v])=>typeChip(k,v)).join("")}</div>`:"";
    $("mtBox").innerHTML = row("DÉBIL CONTRA 💥", m.weak) + row("RESISTE 🛡️", m.resist) + row("NO LE HACEN DAÑO 🚫", m.immune);
  }).catch(()=>{ if(current===p) $("mtBox").innerHTML="<b>DÉBIL CONTRA</b>No se pudo cargar."; });
}

/* ---------- Voz: decir el nombre de un Pokémon (Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const squash = s => norm(s).replace(/[^a-z0-9]/g,"");
function lev(a,b){ const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
/* Busca el Pokémon cuyo nombre se parece más a lo que se escuchó (también por palabras sueltas: "busca a pikachu") */
function bestMatch(heard, pool){
  const cands=new Set();
  heard.forEach(h=>{ const w=norm(h).split(/\s+/).filter(Boolean); cands.add(squash(h));
    w.forEach((x,i)=>{ cands.add(squash(x)); if(w[i+1]) cands.add(squash(x+w[i+1])); }); });
  let best=null, score=0;
  pool.forEach(p=>{ const k=p.sq || (p.sq=squash(p.label));
    cands.forEach(c=>{ if(c.length<3) return; const s = c===k ? 1 : 1 - lev(c,k)/Math.max(c.length,k.length);
      if(s>score){ score=s; best=p; } }); });
  return score>=.6 ? best : null;
}
let rec=null, recBtn=null;
function listen(btn, heardEl, pool, onPick){
  if(!SR) return;
  if(rec){ rec.abort(); return; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  rec = new SR(); rec.lang="es-MX"; rec.interimResults=false; rec.maxAlternatives=5;
  recBtn=btn; btn.classList.add("on"); heardEl.hidden=false; heardEl.textContent="🎤 Te escucho… di el nombre de un Pokémon";
  let got=false;
  rec.onresult = e=>{ got=true; const alts=[...e.results[0]].map(r=>r.transcript);
    const p = bestMatch(alts, typeof pool==="function" ? pool() : pool);
    if(p){ heardEl.textContent=`🎤 Escuché: “${alts[0]}” → ${p.label}`; onPick(p); }
    else { heardEl.textContent=`🎤 Escuché: “${alts[0]}”, pero no encontré ese Pokémon. Intenta otra vez.`; speak("No lo encontré. Intenta otra vez."); } };
  rec.onerror = e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") heardEl.textContent="🎤 Necesito permiso para usar el micrófono.";
    else if(e.error==="no-speech") heardEl.textContent="🎤 No escuché nada. Toca 🎤 y habla fuerte."; };
  rec.onend = ()=>{ btn.classList.remove("on"); rec=null; recBtn=null; if(!got && heardEl.textContent.startsWith("🎤 Te escucho")) heardEl.textContent="🎤 No escuché nada. Toca 🎤 y habla fuerte."; };
  try{ rec.start(); }catch(e){ btn.classList.remove("on"); rec=null; }
}
if(SR){
  ["micDex","micMusic","micQuiz"].forEach(id=>$(id).hidden=false);
  $("micDex").onclick = ()=>listen($("micDex"), $("heardDex"), ()=>list, p=>{ $("q").value=p.label; render(); openSheet(p); });
  $("micMusic").onclick = ()=>listen($("micMusic"), $("heardMusic"), ()=>species, p=>{ if(addToSong(p.id)){ ctx(); playBuf(p.id,1); } });
  $("micQuiz").onclick = ()=>{ if(!qState||qState.done) return; listen($("micQuiz"), $("heardQuiz"), ()=>qState.opts, p=>answer(qState.opts.indexOf(p))); };
}

/* ---------- ¿Quién es ese Pokémon? (silueta o sonido) ---------- */
let qState=null, qScore=store.get("quizScore",0), qStreak=0, qMode=store.get("quizMode","sil");
function quizPool(){
  const g = $("qgen").value==="" ? null : GENS[+$("qgen").value];
  return species.filter(p=>!g || (p.sid>=g[0] && p.sid<=g[1]));
}
function paintQMode(){
  document.querySelectorAll("#qmode button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.q===qMode));
  $("qTitle").textContent = qMode==="snd" ? "¿De quién es este sonido?" : "¿Quién es ese Pokémon?";
}
function newRound(){
  const pool = quizPool(); if(pool.length<3) return;
  const ans = rnd(pool), opts=[ans];
  while(opts.length<3){ const o=rnd(pool); if(!opts.includes(o)) opts.push(o); }
  opts.sort(()=>Math.random()-.5);
  qState={ans, opts, done:false};
  paintQMode();
  const img=$("qImg"); img.className = qMode==="snd" ? "hide" : "sil"; img.style.visibility="hidden";
  img.onload=()=>img.style.visibility=""; img.onerror=()=>{ img.onerror=null; img.src=home(ans.id); };
  img.src=art(ans.id);
  $("qSound").hidden = qMode!=="snd";
  $("qRes").textContent=""; $("qNext").hidden=true; $("heardQuiz").hidden=true;
  $("qOpts").innerHTML = opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${o.label}</button>`).join("");
  paintScore();
  if(qMode==="snd") playCry(ans);
}
function paintScore(){ $("qScore").textContent="✅ "+qScore; $("qStreak").textContent="🔥 "+qStreak; }
function answer(i){
  if(!qState||qState.done||i<0) return;
  qState.done=true; const pick=qState.opts[i], ok = pick===qState.ans;
  $("qImg").className=""; $("qSound").hidden=true;
  [...$("qOpts").children].forEach((x,k)=>{ if(qState.opts[k]===qState.ans) x.classList.add("ok"); else if(k===i) x.classList.add("bad"); });
  if(ok){ qScore++; qStreak++; store.set("quizScore",qScore); $("qRes").textContent = qStreak>=3 ? `¡Correcto! 🔥 ${qStreak} seguidos` : "¡Correcto! 🎉"; }
  else { qStreak=0; $("qRes").textContent="¡Casi! 💪"; }
  paintScore(); $("qNext").hidden=false;
  const p=qState.ans;
  playCry(p).then(()=>speak(ok ? `¡Correcto! Es ${p.label}` : `Es ${p.label}`));
}
$("qOpts").onclick = e=>{ const b=e.target.closest(".opt"); if(b) answer(+b.dataset.i); };
$("qSound").onclick = ()=>{ if(qState) playCry(qState.ans); };
$("qNext").onclick = newRound;
$("qgen").onchange = ()=>{ store.set("quizGen",$("qgen").value); qStreak=0; newRound(); };
$("qmode").onclick = e=>{ const b=e.target.closest("button[data-q]"); if(!b) return; qMode=b.dataset.q; store.set("quizMode",qMode); qStreak=0; newRound(); };
paintQMode();

/* ---------- Música: canción con los cries + batería e instrumentos de fondo (Web Audio) ---------- */
const MAX=16, SPEEDS=[1000,700,430], TONES=[{r:1,i:"🎵"},{r:1.45,i:"⬆️"},{r:.72,i:"⬇️"}];
let song = store.get("dexSong", []).filter(x=>x && typeof x.id==="number"), speedI=store.get("dexSpeed",1), loopOn=false;
let kit = store.get("dexKit", 1), vol = store.get("dexVol", 60), insts = new Set(store.get("dexInsts", ["bass"]));
let ac=null, master=null; const bufs={};
let playing=false, timer=null, step=0, beat=0, nextT=0, uiTimers=[];
function ctx(){
  if(!ac){ const C=window.AudioContext||window.webkitAudioContext; ac=new C(); master=ac.createGain(); master.connect(ac.destination); setVol(vol); }
  if(ac.state==="suspended") ac.resume(); return ac;
}
function setVol(v){ vol=v; if(master) master.gain.value = Math.pow(v/100,1.6)*1.2; }
function loadBuf(id){
  if(!bufs[id]){
    const p=byId[id]; const urls=[CRY+id+".ogg"]; if(p && p.sid!==id) urls.push(CRY+p.sid+".ogg");
    bufs[id] = (async()=>{ for(const u of urls){ try{ const r=await fetch(u); if(!r.ok) continue; const ab=await r.arrayBuffer();
      return await new Promise((ok,bad)=>ctx().decodeAudioData(ab,ok,bad)); }catch(e){} } return null; })();
  }
  return bufs[id];
}
async function playBuf(id, rate, when){
  const b = await loadBuf(id); if(!b) return;
  const a=ctx(), s=a.createBufferSource(), g=a.createGain();
  s.buffer=b; s.playbackRate.value=rate; g.gain.value=.8; s.connect(g).connect(master);
  s.start(Math.max(when||0, a.currentTime));
}
/* Sonidos sintetizados */
const hz = m => 440*Math.pow(2,(m-69)/12);
function env(g,t,peak,att,dec){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+att+dec); }
function tone(type,freq,t,peak,dec,cut){
  const a=ac, o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=freq;
  let out=o; if(cut){ const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(cut,t); f.frequency.exponentialRampToValueAtTime(Math.max(200,cut/6),t+dec); o.connect(f); out=f; }
  out.connect(g).connect(master); env(g,t,peak,.008,dec); o.start(t); o.stop(t+dec+.05);
}
let noiseBuf=null;
function noise(t,dur,type,freq,peak){
  const a=ac; if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noiseBuf; f.type=type; f.frequency.value=freq; s.connect(f).connect(g).connect(master); env(g,t,peak,.002,dur); s.start(t); s.stop(t+dur+.05);
}
function kick(t){ const a=ac, o=a.createOscillator(), g=a.createGain();
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.14);
  g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g).connect(master); o.start(t); o.stop(t+.22); }
const snare = t=>{ noise(t,.16,"bandpass",1800,.5); tone("triangle",190,t,.35,.08); };
const hat = (t,open)=>noise(t,open?.18:.04,"highpass",7500,.22);
const clap = t=>{ [0,.012,.025].forEach(d=>noise(t+d,.07,"bandpass",1200,.45)); };
/* Fondo: progresión Do–Sol–Lam–Fa, un acorde cada 4 tiempos */
const PROG=[{r:36,q:[0,4,7]},{r:43,q:[0,4,7]},{r:45,q:[0,3,7]},{r:41,q:[0,4,7]}];
function backing(t, b, gap){
  const bar=b%4, ch=PROG[Math.floor(b/4)%4], notes=ch.q.map(x=>ch.r+24+x);
  if(kit===1){ kick(t); hat(t+gap/2); }
  if(kit===2){ if(bar%2===0) kick(t); else snare(t); hat(t); hat(t+gap/2); if(bar===3) kick(t+gap/2); }
  if(kit===3){ kick(t); hat(t+gap/2,true); if(bar%2===1) clap(t); }
  if(insts.has("bass")){ tone("sawtooth", hz(ch.r + (bar%2 ? 7 : 0)), t, .32, gap*.8, 700); if(gap<.8) tone("sawtooth", hz(ch.r+12), t+gap/2, .18, gap*.35, 700); }
  if(insts.has("gtr") && bar%2===0) notes.concat(notes[0]+12).forEach((n,i)=>tone("sawtooth",hz(n),t+i*.025,.09,gap*1.4,3200));
  if(insts.has("piano") && bar===0) notes.forEach(n=>{ tone("triangle",hz(n),t,.13,gap*3.6); tone("sine",hz(n+12),t,.04,gap*2); });
  if(insts.has("bell")){ tone("sine",hz(notes[b%3]+24),t,.12,.5); tone("sine",hz(notes[b%3]+36),t,.03,.3); }
}

function addToSong(id){ if(song.length>=MAX) return false; song.push({id, t:0}); saveSong(); loadBuf(id); if(mode==="music") renderSong(); return true; }
function saveSong(){ store.set("dexSong", song); }
function renderSong(){
  $("songCount").textContent = `${song.length} / ${MAX}`;
  $("song").innerHTML = song.length ? song.map((s,i)=>`<button class="slot" type="button" data-i="${i}" aria-label="${byId[s.id]?byId[s.id].label:""}, voz ${["normal","aguda","grave"][s.t]}">
      <span class="n">${i+1}</span>${imgTag(s.id)}<span class="t">${TONES[s.t].i}</span>
      <span class="x" role="button" data-x="${i}" aria-label="Quitar">✕</span></button>`).join("")
    : `<div class="empty">Tu canción está vacía.<br>Toca Pokémon de abajo para agregarlos 👇 o prueba 🎲 Sorpresa</div>`;
  $("playBtn").disabled = !song.length;
}
$("song").onclick = e=>{
  const x=e.target.closest("[data-x]");
  if(x){ e.stopPropagation(); song.splice(+x.dataset.x,1); saveSong(); if(playing && step>=song.length) step=0; if(!song.length) stopSong(); renderSong(); return; }
  const b=e.target.closest(".slot"); if(!b) return;
  const s=song[+b.dataset.i]; s.t=(s.t+1)%TONES.length; saveSong(); renderSong();
  if(!playing){ ctx(); playBuf(s.id, TONES[s.t].r); }
};
function renderPicks(){
  if(!species.length){ $("picks").innerHTML=`<div class="empty">Cargando Pokémon…</div>`; return; }
  const q=norm($("mq").value).replace("#","");
  let pool;
  if(q) pool = species.filter(p=>p.key.includes(q) || String(p.sid)===q.replace(/^0+/,"")).slice(0,60);
  else { const f=[...favs].map(id=>byId[id]).filter(Boolean); pool = [...f, ...species.slice(0, 60-f.length).filter(p=>!favs.has(p.id))]; }
  $("picks").innerHTML = pool.length ? pool.map(p=>`<button type="button" data-id="${p.id}">${imgTag(p.id)}${favs.has(p.id)?"⭐ ":""}${p.label}</button>`).join("")
    : `<div class="empty">No encontré ese Pokémon.</div>`;
}
$("mq").oninput = renderPicks;
$("picks").onclick = e=>{ const b=e.target.closest("button[data-id]"); if(!b) return; const id=+b.dataset.id;
  if(addToSong(id)){ ctx(); playBuf(id,1); } };
$("mDice").onclick = ()=>{ if(!species.length) return; const p=rnd(species); if(addToSong(p.id)){ ctx(); playBuf(p.id,1); } };
$("surpBtn").onclick = ()=>{ if(!species.length) return; ctx(); stopSong();
  song = Array.from({length:8},()=>({id:rnd(species).id, t:rnd([0,0,0,1,2])})); song.forEach(s=>loadBuf(s.id)); saveSong(); renderSong(); };
$("clearBtn").onclick = ()=>{ stopSong(); song=[]; saveSong(); renderSong(); };
$("loopBtn").onclick = ()=>{ loopOn=!loopOn; $("loopBtn").setAttribute("aria-pressed",loopOn); };
function group(id, attr, isOn, onClick){
  const paint=()=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed", isOn(b.dataset[attr])));
  $(id).onclick = e=>{ const b=e.target.closest("button"); if(!b) return; onClick(b.dataset[attr]); paint(); };
  paint();
}
group("speed","s", v=>+v===speedI, v=>{ speedI=+v; store.set("dexSpeed",speedI); });
group("kits","k", v=>+v===kit, v=>{ kit=+v; store.set("dexKit",kit); });
group("insts","in", v=>insts.has(v), v=>{ insts.has(v)?insts.delete(v):insts.add(v); store.set("dexInsts",[...insts]); });
$("vol").value = vol;
$("vol").oninput = ()=>{ setVol(+$("vol").value); store.set("dexVol",vol); };
$("playBtn").onclick = async ()=>{
  if(playing) return stopSong();
  if(!song.length) return;
  const a=ctx(); if("speechSynthesis" in window) speechSynthesis.cancel();
  $("playBtn").textContent="⏳ Cargando…"; $("playBtn").disabled=true;
  await Promise.all(song.map(s=>loadBuf(s.id)));
  $("playBtn").disabled=false;
  if(!song.length || mode!=="music"){ $("playBtn").textContent="▶ Tocar"; return; }
  playing=true; step=0; beat=0; nextT=a.currentTime+.08; $("playBtn").textContent="⏹ Parar"; $("show").hidden=false;
  timer=setInterval(schedule,25); schedule();
};
function schedule(){
  const a=ac, gap=SPEEDS[speedI]/1000;
  while(playing && nextT < a.currentTime+.12){
    if(step>=song.length){
      if(loopOn && song.length) step=0;
      else { const end=(nextT-a.currentTime)*1000+600; clearInterval(timer); timer=null; uiTimers.push(setTimeout(stopSong,end)); playing=false; return; }
    }
    const s=song[step], i=step, t=nextT;
    playBuf(s.id, TONES[s.t].r, t);
    backing(t, beat, gap);
    uiTimers.push(setTimeout(()=>light(i), Math.max(0,(t-a.currentTime)*1000)));
    step++; beat++; nextT+=gap;
  }
}
const NOTES=["🎵","🎶","✨","⭐","🎉"];
function light(i){
  document.querySelectorAll("#song .slot").forEach((el,k)=>el.classList.toggle("on",k===i));
  const s=song[i]; if(!s) return;
  const img=$("showImg"); img.onerror=()=>{ img.onerror=null; img.src=art(s.id); }; img.src=home(s.id);
  const n=document.createElement("span"); n.className="note"; n.textContent=rnd(NOTES); n.style.left=(10+Math.random()*80)+"%";
  $("show").appendChild(n); setTimeout(()=>n.remove(),2300);
}
function stopSong(){
  playing=false; if(timer) clearInterval(timer); timer=null; uiTimers.forEach(clearTimeout); uiTimers=[];
  document.querySelectorAll("#song .slot").forEach(el=>el.classList.remove("on"));
  $("show").hidden=true; $("playBtn").textContent="▶ Tocar"; $("playBtn").disabled=!song.length;
}

/* ---------- Carga inicial ---------- */
const byId = {};
buildUI();
renderSong();
const idOf = u=>+u.split("/").filter(Boolean).pop();
Promise.all([fetch(API+"pokemon-species?limit=1025").then(r=>r.json()), fetch(API+"pokemon?limit=600&offset=1025").then(r=>r.json())])
.then(([sp,fm])=>{
  const sps = sp.results.map(r=>({name:r.name,id:idOf(r.url)}));
  const nameToId = Object.fromEntries(sps.map(s=>[s.name,s.id]));
  sps.forEach(s=>list.push({id:s.id, sid:s.id, base:s.name, label:pretty(s.name), form:null}));
  fm.results.forEach(r=>{
    const id=idOf(r.url); if(id<10000) return;
    if(/-totem|-cap$|-starter|-cosplay|-rock-star|-belle|-pop-star|-phd|-libre/.test(r.name)) return;
    const parts=r.name.split("-"); let base=null;
    for(let k=parts.length-1;k>0;k--){ const b=parts.slice(0,k).join("-"); if(nameToId[b]){ base=b; break; } }
    if(!base) return;
    const form=formInfo(r.name, base);
    list.push({id, sid:nameToId[base], base, label:form.label, form});
  });
  list.forEach(p=>{ p.cats=cats(p); p.key=norm(p.label); byId[p.id]=p; });
  list.sort((a,b)=>a.sid-b.sid || a.id-b.id);
  species = list.filter(p=>!p.form);
  render(); renderSong();
  if(mode==="quiz") newRound();
  if(mode==="music") renderPicks();
}).catch(()=>{ $("status").textContent="Necesito internet para cargar los Pokémon. Conéctate y recarga la página."; });
